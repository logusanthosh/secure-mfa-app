<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify OTP | Secure MFA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="otp-shell">
        <section class="auth-card auth-card-centered" aria-labelledby="verifyTitle">
        <div class="text-center mb-4">
          <div class="otp-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5v-11Z"/><path d="m5 7 7 5 7-5"/></svg></div>
          <p class="eyebrow">Email verification</p>
          <h2 id="verifyTitle" class="brand-text">Verify Your Identity</h2>
          <p class="otp-copy mb-0">We've sent a 6-digit verification code to your email.</p>
        </div>

        <div class="mb-3">
          <label for="otpEmail" class="form-label">Verification email</label>
          <input id="otpEmail" type="email" class="form-control" placeholder="you@example.com" autocomplete="email" />
        </div>

        <form id="otpForm" novalidate>
          <div class="mb-3">
            <label for="otpCode" class="form-label">Enter verification code</label>
            <input id="otpCode" type="text" inputmode="numeric" maxlength="6" class="form-control text-center" placeholder="" autocomplete="one-time-code" aria-describedby="otpHint" required />
          </div>

          <button type="submit" id="verifyOtpButton" class="btn btn-primary w-100 mb-3">Verify Code</button>
          <p id="otpHint" class="resend-hint mb-2">Didn't receive the code?</p>
          <button type="button" id="resendOtpButton" class="btn btn-outline-primary w-100 mb-3">Resend Code</button>

          <div id="otpSuccess" class="alert alert-success auth-alert" role="alert"></div>
          <div id="otpError" class="alert alert-danger auth-alert" role="alert"></div>
        </form>

        <div class="text-center mt-3">
          <span class="text-muted">Need to go back?</span>
          <a href="login.html" class="ms-1 text-decoration-none">Back to Login</a>
        </div>
        </section>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/otp.js"></script>
  </body>
</html>
